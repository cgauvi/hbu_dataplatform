[project]
name = "urban-rag"
version = "0.1.0"
description = "Dagster pipeline that scrapes Montreal's Spectrum Spatial Feature Service into local (geo)parquet, plus a DuckDB/VSS question-answering layer over the result."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "duckdb>=1.4",
    "geopandas>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "dagster-dg-cli>=1.13"]
# The retrieval stack. sentence-transformers pulls torch and transformers, which
# together dominate the size of the environment, so it stays out of the base
# install that the Dagster scrape only needs.
rag = [
    "accelerate>=0.34",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "pypdf>=6.16.1",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
urban-rag = "urban_rag.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_rag"]

[tool.dagster]
module_name = "urban_rag.definitions"
code_location_name = "urban_rag"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "urban_rag"

[tool.pytest.ini_options]
testpaths = ["tests"]
