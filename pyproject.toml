[project]
name = "urban-rag"
version = "0.1.0"
description = "Dagster pipeline that scrapes Montreal's Spectrum Spatial Feature Service into local (geo)parquet, plus a question-answering layer over the result: DuckDB/VSS on a laptop, Postgres/pgvector on RDS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "dagster>=1.11",
    "dagster-postgres>=0.29",
    "dagster-webserver>=1.11",
    "duckdb>=1.4",
    "geopandas>=1.0",
    # Reads the CMHC survey workbook (urban_rag.cmhc); pandas needs it as the
    # xlsx engine and does not pull it in itself.
    "openpyxl>=3.1",
    # CP-SAT, for the development program in urban_rag.program. Gross floor
    # area is a footprint the model chooses times a storey count it also
    # chooses, so the one constraint that matters is a product of two decision
    # variables and an LP cannot express it. ~30 MB, no transitive weight.
    "ortools>=9.10",
    "pandas>=2.2",
    # Reads linked zoning PDFs for the document corpus. Kept in the base install
    # because it is small and the asset can fetch PDFs without the encoder stack.
    #
    # Capped below 7 because `urban_rag.zoning_grid` reaches into the layout
    # mode's internals - `_text_extraction._layout_mode` and `_font` - for the
    # user-space coordinates of each string, which `extract_text` computes and
    # then spends on a fixed-width character grid rather than returning. The
    # module docstring says why nothing public will do. These names have moved
    # between major versions before, so an upgrade past 6 is a change to make
    # deliberately: tests/unit/test_zoning_grid.py parses a real PDF end to end
    # and is what fails if they move again.
    "pypdf>=6.16.1,<7",
    # The Postgres/pgvector store (rag/pgvector.py) and its type adapter. In the
    # base install rather than the `rag` extra: loading a partition into the
    # store is an asset, so the code location needs the driver even in the slim
    # image that has no encoder. Both are small; neither pulls torch.
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    # geopandas already depends on this and uses it as its default I/O engine.
    # Named here because `urban_rag.role_foncier` calls it directly rather than
    # through geopandas: the assessment roll is a 2.8 GB GeoPackage of five
    # layers, and `list_layers` (to resolve the year-stamped layer names) and
    # `read_dataframe(..., where=...)` (to filter to Montreal in OGR rather
    # than in memory) have no `geopandas.read_file` equivalent.
    "pyogrio>=0.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "s3fs>=2024.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "dagster-dg-cli>=1.13",
    "moto[s3]>=5.0",
    # DuckDB's `vss` extension, as a wheel instead of a runtime download.
    # `INSTALL vss` fetches ~11 MB from extensions.duckdb.org, which the
    # TLS-inspecting proxy this project already accommodates elsewhere
    # truncates at ~0.5 MB - for curl, requests and DuckDB alike - while
    # answering `403` to the Range request that would let a client resume.
    # PyPI is not inspected the same way, so this is the one route to the
    # extension that works from behind it, and without it every test in
    # tests/unit/test_store.py fails on a machine that cannot reach the
    # extension repository.
    #
    # In `dev` rather than the base install: it is the *test suite* that needs
    # vss present without a network, and `urban_rag.rag.vss` still installs it
    # by its own routes at runtime when this is absent.
    #
    # Both packages come from https://github.com/santosh-d3vpl3x/duckdb_extensions,
    # a third party repackaging DuckDB's own published binaries - not DuckDB
    # Labs. `duckdb-extension-vss` pins `duckdb==` its own version exactly, so
    # the two move in lockstep and a duckdb upgrade waits on a matching
    # extension release.
    "duckdb-extensions>=1.5.5",
    "duckdb-extension-vss>=1.5.5",
]
# The retrieval stack. sentence-transformers pulls torch and transformers, which
# together dominate the size of the environment, so it stays out of the base
# install that the Dagster scrape only needs.
rag = [
    "accelerate>=0.34",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
urban-rag = "urban_rag.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_rag"]

[tool.dagster]
module_name = "urban_rag.definitions"
code_location_name = "urban_rag"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "urban_rag"

[tool.pytest.ini_options]
testpaths = ["tests"]
